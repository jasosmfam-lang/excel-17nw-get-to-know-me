<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>EXCEL 17NW | Get to Know Me</title><link rel='preconnect' href='https://fonts.googleapis.com'><link rel='preconnect' href='https://fonts.gstatic.com' crossorigin><link href='https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap' rel='stylesheet'><style>:root{--b:#123f9a;--b2:#6aa8ff;--r:#e3314b;--bg:#f6f8fc}*{box-sizing:border-box}body{margin:0;font-family:Poppins,sans-serif;background:var(--bg)}.wrap{max-width:700px;margin:auto;padding:16px}.hero{background:linear-gradient(135deg,#0e2d7a,#1e4ba5,#5f9fff);color:#fff;padding:48px 24px;border-radius:30px;text-align:center}.hero h1{margin:10px 0;font-size:3rem}.hero .team{letter-spacing:4px}.card{background:#fff;padding:22px;border-radius:22px;margin-top:18px;box-shadow:0 8px 20px rgba(0,0,0,.08)}input,textarea,select{width:100%;padding:14px;margin:8px 0;border:1px solid #d9e0ea;border-radius:14px;font-family:inherit}textarea{min-height:110px}.step{display:none}.step.active{display:block}.nav{display:flex;gap:10px;margin-top:16px}.btn{flex:1;padding:16px;border:none;border-radius:14px;font-weight:600}.next,.submit{background:var(--b);color:#fff}.back{background:#e8edf8}.progress{height:10px;background:#d8e3f8;border-radius:99px;overflow:hidden;margin:15px 0}.bar{height:100%;width:20%;background:var(--r);transition:.3s}label{display:block;margin:8px 0}h3{color:var(--b)}</style></head><body><div class='wrap'><div class='hero'><div class='team'>EXCEL 17NW</div><h1>Get to Know Me</h1><p>Help us make tournament weekends, meals, activities and team events even better.</p></div><div class='progress'><div class='bar' id='bar'></div></div><form><div class='card step active'><h3>🤍 About Me</h3><input placeholder='Name'><input placeholder='Birthday (MM/DD)'><input placeholder='Favorite Color'><select><option>T‑Shirt Size</option><option>XS</option><option>S</option><option>M</option><option>L</option><option>XL</option></select></div><div class='card step'><h3>🩵 Food & Travel</h3><textarea placeholder='Food allergies, restrictions, foods you avoid...'></textarea><label><input type='checkbox'> Team Dinners</label><label><input type='checkbox'> Escape Rooms</label><label><input type='checkbox'> Photo Spots</label><label><input type='checkbox'> Art Activities</label><input placeholder="One activity you've always wanted to try"></div><div class='card step'><h3>🩵 Favorites</h3><p>Leave any blank if you don't have a favorite 😊</p><input placeholder='Favorite Music Artist'><input placeholder='Favorite Store'><input placeholder='Favorite Scent'><input placeholder='Favorite Candy'><input placeholder='Favorite Starbucks, Dutch Bros, Sonic, or other go‑to drink'></div><div class='card step'><h3>🎁 Just For Fun</h3><textarea placeholder='If a teammate had $20 at Target, what aisle should they shop in?'></textarea><textarea placeholder='What are you currently obsessed with?'></textarea><textarea placeholder='What would you hope is in a surprise goodie bag?'></textarea><textarea placeholder="What gifts aren't really your thing?"></textarea></div><div class='card step'><h3>⭐ Anything Else?</h3><textarea placeholder='Anything you would like the team moms to know?'></textarea></div><div class='nav'><button type='button' class='btn back' onclick='move(-1)'>Back</button><button type='button' class='btn next' id='nextBtn' onclick='move(1)'>Next</button></div></form></div><script>let i=0;const s=[...document.querySelectorAll('.step')];function render(){s.forEach((e,n)=>e.classList.toggle('active',n===i));document.getElementById('bar').style.width=((i+1)/s.length*100)+'%';document.querySelector('.back').style.visibility=i? 'visible':'hidden';document.getElementById('nextBtn').textContent=i===s.length-1?'Submit':'Next';}function move(d){if(i===s.length-1&&d===1){alert('Form ready. Connect Google Sheets next.');return;}i=Math.max(0,Math.min(s.length-1,i+d));render()}render();</script></body></html>
